  <div class="flex gap-2">

      class="px-3 py-2 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">

      class="px-3 py-2 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">

<script type="module">
import { getJobs, getFilters, getToken, matchJobs } from '../js/api.js';
import { assembleResumeText } from '../js/resume.js';

let currentFilters = { page: 1, page_size: 20, sort: 'latest' };
let matchScores = {};

async function loadFilters() {
  try {
    const filters = await getFilters();
    populateSelect('cityFilter', filters.cities, '全部城市');
    populateSelect('typeFilter', filters.recruit_types, '全部类型');
    populateSelect('categoryFilter', filters.job_categories, '全部类别');
  } catch (e) {
    console.error('Failed to load filters:', e);
  }
}

function populateSelect(id, options, placeholder) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<option value="">${placeholder}</option>`;
  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    el.appendChild(o);
  });
}

async function loadJobs() {
  const container = document.getElementById('jobList');
  if (container) container.innerHTML = '<div class="text-center py-8 text-on-surface-variant">加载中...</div>';
  try {
    const data = await getJobs(currentFilters);
    window._lastTotal = data.total;
    renderJobs(data.items);
    renderPagination(data.total, data.page, data.page_size);
    if (getToken() && data.items.length > 0) {
      loadMatchScores(data.items.map(j => j.id));
    }
  } catch (e) {
    if (container) container.innerHTML = '<div class="text-center py-8 text-error">加载失败，请稍后重试</div>';
  }
}

async function loadMatchScores(jobIds) {
  const resumeText = assembleResumeText();
  if (!resumeText) return;
  try {
    const result = await matchJobs(resumeText, jobIds.slice(0, 50));
    matchScores = result.scores || {};
    updateMatchBadges();
  } catch (e) {
    console.error('Match scores failed:', e);
  }
}

function updateMatchBadges() {
  Object.entries(matchScores).forEach(([jobId, score]) => {
    if (score === null) return;
    const card = document.querySelector(`[data-job-id="${jobId}"]`);
    if (!card) return;
    const existing = card.querySelector('.match-badge');
    if (existing) existing.remove();
    const badge = document.createElement('span');
    badge.className = 'match-badge inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-primary text-on-primary ml-2';
    badge.textContent = `匹配 ${score}%`;
    const titleEl = card.querySelector('.job-title');
    if (titleEl) titleEl.appendChild(badge);
  });
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    return new Date(dateStr).toLocaleDateString('zh-CN');
  } catch {
    return '';
  }
}

function renderJobs(jobs) {
  const container = document.getElementById('jobList');
  if (!container) return;
  if (!jobs || jobs.length === 0) {
    container.innerHTML = '<div class="text-center py-12 text-on-surface-variant">暂无符合条件的职位</div>';
    return;
  }
  container.innerHTML = jobs.map(job => `
    <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow cursor-pointer border border-outline-variant/20"
         data-job-id="${job.id}"
         onclick="window.location.href='/pages/job-detail.html?id=${job.id}'">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
          <h3 class="job-title text-lg font-bold text-on-surface truncate">${escapeHtml(job.title)}</h3>
          <p class="text-on-surface-variant mt-1">${escapeHtml(job.company)}</p>
        </div>
        <div class="flex flex-col items-end gap-1 shrink-0">
          ${job.recruit_type ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-secondary-container text-on-secondary-container">${escapeHtml(job.recruit_type)}</span>` : ''}
        </div>
      </div>
      <div class="flex flex-wrap gap-3 mt-3 text-sm text-on-surface-variant">
        ${job.work_city ? `<span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">location_on</span>${escapeHtml(job.work_city)}</span>` : ''}
        ${job.job_category ? `<span>${escapeHtml(job.job_category)}</span>` : ''}
        ${job.publish_time ? `<span>${formatDate(job.publish_time)}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function renderPagination(total, page, pageSize) {
  const container = document.getElementById('pagination');
  if (!container) return;
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  const pages = [];
  for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) pages.push(i);
  container.innerHTML = `
    <div class="flex items-center justify-center gap-2 py-6">
      <button onclick="goToPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}
        class="px-3 py-1.5 rounded-lg text-sm font-medium ${page <= 1 ? 'text-outline cursor-not-allowed' : 'text-on-surface hover:bg-surface-container-high'}">
        上一页
      </button>
      ${pages.map(p => `
        <button onclick="goToPage(${p})"
          class="px-3 py-1.5 rounded-lg text-sm font-medium ${p === page ? 'bg-primary text-on-primary' : 'text-on-surface hover:bg-surface-container-high'}">
          ${p}
        </button>
      `).join('')}
      <button onclick="goToPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}
        class="px-3 py-1.5 rounded-lg text-sm font-medium ${page >= totalPages ? 'text-outline cursor-not-allowed' : 'text-on-surface hover:bg-surface-container-high'}">
        下一页
      </button>
      <span class="text-sm text-on-surface-variant ml-2">共 ${total} 个职位</span>
    </div>
  `;
}

window.goToPage = function(page) {
  const totalPages = Math.ceil((window._lastTotal || 0) / currentFilters.page_size);
  if (page < 1 || page > totalPages) return;
  currentFilters.page = page;
  loadJobs();
};

window.applyFilters = function() {
  const q = document.getElementById('searchInput')?.value?.trim();
  const city = document.getElementById('cityFilter')?.value;
  const recruit_type = document.getElementById('typeFilter')?.value;
  const job_category = document.getElementById('categoryFilter')?.value;
  currentFilters = { page: 1, page_size: 20, sort: 'latest' };
  if (q) currentFilters.q = q;
  if (city) currentFilters.city = city;
  if (recruit_type) currentFilters.recruit_type = recruit_type;
  if (job_category) currentFilters.job_category = job_category;
  loadJobs();
};

document.addEventListener('DOMContentLoaded', () => {
  loadFilters();
  loadJobs();
  document.getElementById('searchBtn')?.addEventListener('click', applyFilters);
  document.getElementById('searchInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') applyFilters();
  });
});
</script>
