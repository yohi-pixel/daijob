version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: yesjob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yesjob
      MYSQL_USER: yesjob
      MYSQL_PASSWORD: yesjob123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yesjob-net

  backend:
    build: .
    container_name: yesjob-backend
    environment:
      - DATABASE_URL=mysql+aiomysql://yesjob:yesjob123@mysql:3306/yesjob
      - JOBS_FILE=/app/data/jobs.jsonl
    ports:
      - "8000:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yesjob-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yesjob-frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - yesjob-net

volumes:
  mysql_data:

networks:
  yesjob-net:
    driver: bridge
