version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: yesjob-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: yesjob
      MYSQL_USER: yesjob
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yesjob123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yesjob-net
    restart: unless-stopped

  backend:
    build: .
    container_name: yesjob-backend
    env_file:
      - .env
    ports:
      - "8000:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yesjob-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: yesjob-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./daijob.site_nginx:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - yesjob-net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  yesjob-net:
    driver: bridge
